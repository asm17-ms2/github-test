name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - run: test ! -e FILTER_FAIL
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
      - env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.merge_group.head_sha || github.sha }}
          BACKEND_FILES: ${{ steps.filter.outputs.backend_files }}
          FRONTEND_FILES: ${{ steps.filter.outputs.frontend_files }}
        run: |
          echo "event=$EVENT base=$BASE head=$HEAD"
          echo "backend files: $BACKEND_FILES"
          echo "frontend files: $FRONTEND_FILES"

  backend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git log --oneline -5
      - run: test ! -e backend/FAIL
      - run: sleep 30

  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test ! -e frontend/FAIL
      - if: github.event_name == 'merge_group'
        run: test ! -e frontend/QUEUE_FAIL
      - run: sleep 30
